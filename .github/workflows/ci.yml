# Push and pull-request gate: typecheck does not need harness sources;
# vitest aliases @deepseek-ai/* to a sibling deepseek-harness checkout.
name: ci

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh-ui-liquid-glass
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v5
        with:
          path: dsh-ui-liquid-glass

      - name: Checkout deepseek-harness (test source plane)
        uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-harness
          # Peer packages are 0.1.1-rc.2; pin so harness master cannot
          # turn this plugin's tests red on an unrelated upstream change.
          ref: dsh-v0.1.1-rc.2
          path: deepseek-harness

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            dsh-ui-liquid-glass/pnpm-lock.yaml
            deepseek-harness/pnpm-lock.yaml

      - name: Install plugin
        run: pnpm install --frozen-lockfile

      # vitest aliases @deepseek-ai/* to harness sources. Vite then resolves
      # those files' bare imports (clsx, zod, @testing-library/react, …)
      # from the harness tree, not from this plugin's node_modules.
      - name: Install deepseek-harness
        working-directory: deepseek-harness
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test
